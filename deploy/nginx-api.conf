# Goes inside the existing server block for nekara.xyz, above `location / `.
#
# The site fetches /api/register on its own origin, so the prefix has to survive
# the hop — proxy_pass without a trailing slash keeps it.

location /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# The live feed. Tier comes from the signed token in the query string and
# nothing else the client sends, so this needs no auth of its own.
location /feed {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host       $host;
    proxy_read_timeout 3600s;
}
