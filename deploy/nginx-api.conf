# Goes inside the existing server block for nekara.xyz, above `location / `.
#
# The site fetches /api/register on its own origin, so the prefix has to survive
# the hop — proxy_pass without a trailing slash keeps it.

location /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# Every share post ends with nekara.xyz/call/<seq>, and the site is one page.
# Without this the most-clicked link the product produces answers 404.
location /call/ {
    try_files $uri /index.html;
}

# The pages are static and reference /assets/app.js by a stable name, so a
# browser that cached yesterday's copy would keep running it. Revalidate rather
# than guess: the files are small and a 304 costs nothing.
location /assets/ {
    add_header Cache-Control "no-cache";
}

# The live feed. Tier comes from the signed token in the query string and
# nothing else the client sends, so this needs no auth of its own.
location /feed {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host       $host;
    proxy_read_timeout 3600s;
}
