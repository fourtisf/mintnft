# Goes inside the existing server block for nekara.xyz, above `location / `.
#
# The site fetches /api/register on its own origin, so the prefix has to survive
# the hop — proxy_pass without a trailing slash keeps it.

location /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# Every share post ends with nekara.xyz/call/<seq>. The engine serves that page
# so it can carry the call's own preview tags — a static file cannot vary them,
# and a link whose preview shows different numbers than the post is worse than
# no preview. If the engine is not answering, the static page still loads.
location /call/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @spa;
}
location @spa {
    try_files /index.html =404;
}

# The views have real addresses — /signals, /hindsight, /triage, /custody,
# /mint — so a page can be linked to and survives a reload. They are one HTML
# file with no directory behind them, so without this a refresh on any of them
# is a 404 from the file server: the link works only for someone already on the
# site, which is the opposite of what an address is for.
#
# /keys stays for good. The page was renamed to /mint, but contractURI() shipped
# the old address on-chain in a contract with no setter, so every marketplace
# that reads the collection reads that link. Dropping it here would 404 it.
location ~ ^/(signals|hindsight|triage|custody|mint|keys)/?$ {
    try_files /index.html =404;
}

# The social cards. Every share post and every preview tag points at these, so
# without this the images a link is judged by answer 404 from the file server.
location /og/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
}

# Sign-in. The auth routes sit at the root rather than under /api/, and without
# this they reach the static root and answer 404 — which on the page looks
# exactly like a wallet refusing to sign.
location /auth/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# The pages are static and reference /assets/app.js by a stable name, so a
# browser that cached yesterday's copy would keep running it. Revalidate rather
# than guess: the files are small and a 304 costs nothing.
location /assets/ {
    add_header Cache-Control "no-cache";
}

# The live feed. Tier comes from the signed token in the query string and
# nothing else the client sends, so this needs no auth of its own.
location /feed {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host       $host;
    proxy_read_timeout 3600s;
}
